<!DOCTYPE html>
<html><head>
<title>SiteSale GeoFix - All Tools Working</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:sans-serif;background:#f1f5f9;padding:15px}
.box{background:white;padding:18px;border-radius:14px;max-width:650px;margin:15px auto;box-shadow:0 2px 10px #ddd}
input,select,textarea{width:100%;padding:12px;margin:7px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:14px;background:#2563eb;color:white;border:none;border-radius:8px;font-size:16px;font-weight:bold}
.result{margin-top:12px;padding:14px;background:#eef2ff;border-radius:10px;display:none}
h1{text-align:center} h2{margin-top:0}
</style></head><body>
<h1>SiteSale GeoFix</h1>
<p style="text-align:center">Sab tools ab active hain - Check dabate hi result aayega</p>

<!-- TOOL 1 -->
<div class="box">
<h2>1. US SEO Checker 🇺🇸</h2>
<input id="t1_url" placeholder="Website URL">
<input id="t1_title" placeholder="Page Title">
<textarea id="t1_desc" placeholder="Meta Description"></textarea>
<input id="t1_kw" placeholder="Main Keyword for US">
<button onclick="seoCheck()">CHECK SEO</button>
<div id="r1" class="result"></div>
</div>

<!-- TOOL 2 -->
<div class="box">
<h2>2. Geo Traffic Analyzer 🌍</h2>
<input id="t2_total" type="number" placeholder="Total Visitors - jese 1000">
<input id="t2_us" type="number" placeholder="US Visitors - jese 600">
<select id="t2_country"><option value="US">Target Country: US</option><option value="UK">Target Country: UK</option><option value="PK">Target Country: Pakistan</option></select>
<button onclick="geoCheck()">ANALYZE TRAFFIC</button>
<div id="r2" class="result"></div>
</div>

<!-- TOOL 3 -->
<div class="box">
<h2>3. Traffic Quality Check ✅</h2>
<input id="t3_vis" type="number" placeholder="Total Visitors">
<input id="t3_bounce" type="number" placeholder="Bounce Rate % - jese 40">
<input id="t3_time" type="number" placeholder="Avg Time on Site in Seconds - jese 120">
<button onclick="qualityCheck()">CHECK QUALITY</button>
<div id="r3" class="result"></div>
</div>

<script>
function seoCheck(){
 let title=document.getElementById('t1_title').value;
 let desc=document.getElementById('t1_desc').value;
 let kw=document.getElementById('t1_kw').value.toLowerCase();
 let s=0, m="";
 if(title.length>=30 && title.length<=60){s+=35; m+="<p>✅ Title perfect: "+title.length+" letters</p>";} else{m+="<p>❌ Title "+title.length+" letters hai, 30-60 hona chahiye</p>";}
 if(desc.length>=120 && desc.length<=160){s+=35; m+="<p>✅ Description perfect: "+desc.length+" letters</p>";} else{m+="<p>❌ Description "+desc.length+" letters hai, 120-160 hona chahiye</p>";}
 if(kw && title.toLowerCase().includes(kw)){s+=30; m+="<p>✅ Keyword Title me hai</p>";} else{m+="<p>❌ Keyword Title me nahi hai</p>";}
 let r=document.getElementById('r1'); r.style.display='block';
 r.innerHTML="<h3>SEO Score: "+s+"/100</h3>"+m+"<p><b>Advice:</b> US ke liye Title me keyword zaroor rakhein.</p>";
}
function geoCheck(){
 let total=Number(document.getElementById('t2_total').value);
 let us=Number(document.getElementById('t2_us').value);
 let country=document.getElementById('t2_country').value;
 if(!total||!us){alert("Dono numbers daalein"); return;}
 let pct=Math.round(us/total*100);
 let msg = pct>=50 ? "✅ Bohat Acha! Aap ka zyada traffic "+country+" se hai, ye US selling ke liye best hai." : "⚠️ Sirf "+pct+"% traffic "+country+" se hai. US traffic barhane ki zaroorat hai.";
 let r=document.getElementById('r2'); r.style.display='block';
 r.innerHTML="<h3>"+country+" Traffic: "+pct+"%</h3><p>Total: "+total+" | "+country+": "+us+"</p><p>"+msg+"</p><p><b>Advice:</b> US audience ke liye US keyword aur US time par post karein.</p>";
}
function qualityCheck(){
 let v=Number(document.getElementById('t3_vis').value);
 let b=Number(document.getElementById('t3_bounce').value);
 let t=Number(document.getElementById('t3_time').value);
 if(!v){alert("Visitors daalein"); return;}
 let score=100; let msg="";
 if(b>80){score-=40; msg+="<p>❌ Bounce Rate "+b+"% bohat zyada hai - lagta hai bot traffic hai</p>";} else if(b>60){score-=15; msg+="<p>⚠️ Bounce Rate "+b+"% thora zyada hai</p>";} else{msg+="<p>✅ Bounce Rate "+b+"% acha hai - asli log lag rahe hain</p>";}
 if(t<30){score-=40; msg+="<p>❌ Log sirf "+t+" sec rukte hain - ye nakli traffic lagta hai</p>";} else if(t<90){score-=10; msg+="<p>⚠️ Log "+t+" sec rukte hain - theek hai</p>";} else{msg+="<p>✅ Log "+t+" sec rukte hain - asli aur achi quality hai</p>";}
 let r=document.getElementById('r3'); r.style.display='block';
 r.innerHTML="<h3>Quality Score: "+score+"/100</h3>"+msg+"<p><b>Result:</b> "+(score>=70?"Aap ka traffic asli lag raha hai":"Traffic me bot / nakli ka shak hai, source check karein")+"</p>";
}
</script></body></html>
