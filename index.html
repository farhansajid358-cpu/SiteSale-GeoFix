      :root{
        --purple:#7c3aed;
        --purple-dark:#6d28d9;
        --purple-deep:#5b21b6;
        --lav:#ede9fe;
        --lav-soft:#f5f2ff;
        --lav-banner:#e9e4fd;
        --ink:#191331;
        --ink-2:#3f3a56;
        --muted:#6f6a85;
        --bg:#fdfcfa;
        --card:#ffffff;
        --line:#e9e6f2;
        --good:#15803d;
        --good-bg:#eafaf0;
        --warn:#b45309;
        --warn-bg:#fdf3e3;
        --bad:#dc2626;
        --bad-bg:#fdeeee;
        --shadow:0 10px 30px rgba(80,55,180,.08);
        --shadow-lg:0 24px 50px rgba(80,55,180,.14);
        --r-lg:24px;
        --r-md:16px;
      }
      *{box-sizing:border-box}
      html{scroll-behavior:smooth}
      body{
        margin:0;
        font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
        background:var(--bg);
        color:var(--ink);
        -webkit-font-smoothing:antialiased;
      }
      img,svg{display:block}
      a{color:inherit;text-decoration:none}
      button,[role="button"],select,summary,input:not([type="checkbox"],[type="radio"]),textarea{min-height:2.25rem}
      .wrap{max-width:1180px;margin:0 auto;padding:0 24px}

      /* ---------- Header ---------- */
      header{
        position:sticky;top:0;z-index:50;
        background:rgba(253,252,250,.9);
        backdrop-filter:blur(10px);
        border-bottom:1px solid transparent;
      }
      .nav{display:flex;align-items:center;gap:28px;padding:16px 0}
      .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;letter-spacing:-.02em}
      .brand-mark{
        width:34px;height:34px;border-radius:10px;background:var(--purple);
        display:grid;place-items:center;color:#fff;flex:none;
        box-shadow:0 6px 14px rgba(124,58,237,.35);
      }
      .brand span em{font-style:normal;color:var(--purple)}
      .nav-links{display:flex;gap:30px;margin:0 auto}
      .nav-links a{font-size:.92rem;font-weight:600;color:var(--ink-2);padding:10px 2px;position:relative}
      .nav-links a.active{color:var(--purple)}
      .nav-links a.active::after{
        content:"";position:absolute;left:0;right:0;bottom:2px;height:3px;border-radius:3px;background:var(--purple);
      }
      .nav-links a:hover{color:var(--purple)}
      .nav-actions{display:flex;align-items:center;gap:14px}
      .icon-btn{
        width:40px;height:40px;border-radius:50%;border:0;background:transparent;cursor:pointer;
        display:grid;place-items:center;color:var(--ink);
      }
      .icon-btn:hover{background:var(--lav-soft);color:var(--purple)}
      .btn{
        display:inline-flex;align-items:center;justify-content:center;gap:9px;
        background:var(--purple);color:#fff;border:0;cursor:pointer;
        font:inherit;font-weight:700;font-size:.95rem;
        padding:13px 26px;border-radius:999px;min-height:48px;
        box-shadow:0 10px 22px rgba(124,58,237,.28);
        transition:background .18s ease,transform .18s ease,box-shadow .18s ease;
      }
      .btn:hover{background:var(--purple-dark);transform:translateY(-1px);box-shadow:0 14px 26px rgba(124,58,237,.32)}
      .btn:active{transform:translateY(0)}
      .btn.small{padding:10px 22px;min-height:44px;font-size:.9rem}
      .btn.ghost{
        background:#fff;color:var(--ink);box-shadow:none;border:1px solid var(--line);
      }
      .btn.ghost:hover{border-color:var(--purple);color:var(--purple);background:var(--lav-soft)}

      /* ---------- Hero ---------- */
      .hero{position:relative;overflow:hidden;padding:56px 0 30px}
      .hero-grid{display:grid;grid-template-columns:1.02fr 1fr;gap:48px;align-items:center}
      .pill{
        display:inline-flex;align-items:center;gap:8px;
        background:var(--lav);color:var(--purple-deep);
        font-size:.82rem;font-weight:700;
        padding:8px 16px;border-radius:999px;
      }
      .pill .dot{width:8px;height:8px;border-radius:50%;background:var(--purple)}
      .pill.light{background:rgba(255,255,255,.75);color:var(--purple-deep)}
      .hero h1{
        font-size:clamp(2.4rem,4.6vw,3.6rem);line-height:1.08;letter-spacing:-.03em;
        margin:20px 0 18px;font-weight:800;
      }
      .hero h1 .accent{color:var(--purple)}
      .hero p.lead{font-size:1.06rem;line-height:1.65;color:var(--muted);max-width:46ch;margin:0 0 30px}
      .hero-ctas{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
      .demo-btn{
        display:inline-flex;align-items:center;gap:11px;background:none;border:0;cursor:pointer;
        font:inherit;font-weight:700;font-size:.95rem;color:var(--ink);padding:8px 4px;min-height:48px;
      }
      .demo-btn .play{
        width:42px;height:42px;border-radius:50%;background:#fff;border:1px solid var(--line);
        display:grid;place-items:center;color:var(--purple);box-shadow:var(--shadow);
      }
      .demo-btn:hover{color:var(--purple)}

      .hero-visual{position:relative;min-height:380px}
      .blob{
        position:absolute;width:430px;height:430px;border-radius:50%;
        background:var(--lav);top:-70px;right:-60px;z-index:0;
      }
      .dash{
        position:relative;z-index:2;background:var(--card);border:1px solid var(--line);
        border-radius:var(--r-lg);box-shadow:var(--shadow-lg);padding:22px;max-width:410px;margin-left:auto;
      }
      .dash-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
      .dash-top .dots{display:flex;gap:6px}
      .dash-top .dots i{width:10px;height:10px;border-radius:50%;background:var(--lav)}
      .dash-top .dots i:first-child{background:var(--purple)}
      .dash-title{font-size:.8rem;font-weight:700;color:var(--muted)}
      .dash-main{display:flex;gap:20px;align-items:center}
      .ring-wrap{position:relative;width:118px;height:118px;flex:none}
      .ring-wrap svg{transform:rotate(-90deg)}
      .ring-bg{stroke:var(--lav)}
      .ring-fg{stroke:var(--purple);stroke-linecap:round}
      .ring-num{
        position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
      }
      .ring-num b{font-size:1.7rem;letter-spacing:-.02em}
      .ring-num small{font-size:.68rem;font-weight:700;color:var(--muted)}
      .dash-rows{flex:1;display:grid;gap:12px}
      .dash-row{display:grid;gap:5px}
      .dash-row .lbl{display:flex;justify-content:space-between;font-size:.78rem;font-weight:700;color:var(--ink-2)}
      .dash-row .lbl b{color:var(--ink)}
      .bar{height:8px;border-radius:99px;background:var(--lav);overflow:hidden}
      .bar i{display:block;height:100%;border-radius:99px;background:var(--purple)}
      .bar i.alt{background:#a78bfa}
      .bar i.alt2{background:#c4b5fd}
      .dash-checks{display:grid;gap:8px;margin-top:18px}
      .dash-check{
        display:flex;align-items:center;gap:9px;font-size:.83rem;font-weight:600;color:var(--ink-2);
        background:var(--lav-soft);border-radius:10px;padding:9px 12px;
      }
      .dash-check .tick{
        width:20px;height:20px;border-radius:50%;background:var(--purple);color:#fff;flex:none;
        display:grid;place-items:center;
      }
      .phone{
        position:absolute;z-index:3;left:0;bottom:-6px;width:150px;
        background:var(--ink);border-radius:26px;padding:9px;box-shadow:var(--shadow-lg);
      }
      .phone-in{background:#fff;border-radius:19px;padding:14px 13px;display:grid;gap:9px}
      .phone-in .ph-title{font-size:.68rem;font-weight:800;color:var(--muted);letter-spacing:.04em}
      .phone-in .ph-big{font-size:1.45rem;font-weight:800;letter-spacing:-.02em}
      .phone-in .ph-big span{color:var(--purple);font-size:.85rem}
      .mini-bar{height:7px;border-radius:99px;background:var(--lav);overflow:hidden}
      .mini-bar i{display:block;height:100%;width:60%;background:var(--purple);border-radius:99px}
      .phone-in .ph-note{font-size:.68rem;font-weight:600;color:var(--muted);line-height:1.45}
      .float-badge{
        position:absolute;z-index:4;display:flex;align-items:center;gap:8px;
        background:#fff;border-radius:999px;box-shadow:var(--shadow-lg);
        padding:10px 16px;font-size:.82rem;font-weight:700;color:var(--ink);
      }
      .float-badge .fi{
        width:26px;height:26px;border-radius:50%;background:var(--lav);color:var(--purple);
        display:grid;place-items:center;flex:none;
      }
      .fb-1{top:6px;left:26px}
      .fb-2{bottom:34px;right:-4px}
      .spark{position:absolute;color:var(--purple);z-index:1}
      .spark-1{top:0;right:6px}
      .spark-2{bottom:110px;left:-14px}

      /* ---------- Trust strip ---------- */
      .trust{
        margin:44px 0 10px;background:var(--card);border:1px solid var(--line);
        border-radius:var(--r-lg);box-shadow:var(--shadow);
        display:grid;grid-template-columns:repeat(4,1fr);
      }
      .trust-item{display:flex;gap:13px;align-items:flex-start;padding:22px 24px}
      .trust-item + .trust-item{border-left:1px solid var(--line)}
      .trust-item .ti{color:var(--purple);flex:none;margin-top:2px}
      .trust-item b{display:block;font-size:.93rem;margin-bottom:2px}
      .trust-item span{font-size:.8rem;color:var(--muted)}

      /* ---------- Sections ---------- */
      section.block{padding:58px 0 8px}
      .sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:30px}
      .sec-label{
        display:flex;align-items:center;gap:10px;font-size:.9rem;font-weight:700;color:var(--ink-2);margin-bottom:10px;
      }
      .sec-label::before{content:"";width:26px;height:3px;border-radius:3px;background:var(--purple)}
      h2.sec-title{font-size:clamp(1.6rem,3vw,2.15rem);letter-spacing:-.025em;margin:0;font-weight:800}
      .view-all{
        display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.92rem;color:var(--purple);
        padding:10px 4px;min-height:44px;white-space:nowrap;
      }
      .view-all:hover{color:var(--purple-dark)}

      /* ---------- Tool cards ---------- */
      .tools-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;align-items:start}
      .tool{
        background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
        box-shadow:var(--shadow);padding:26px 24px 24px;position:relative;
      }
      .tool-num{
        position:absolute;top:22px;right:22px;
        font-size:.78rem;font-weight:800;color:var(--purple);background:var(--lav);
        padding:5px 11px;border-radius:999px;
      }
      .tool-icon{
        width:54px;height:54px;border-radius:16px;background:var(--lav);color:var(--purple);
        display:grid;place-items:center;margin-bottom:16px;
      }
      .tool h3{margin:0 0 7px;font-size:1.22rem;letter-spacing:-.02em}
      .tool .tool-sub{margin:0 0 20px;font-size:.9rem;line-height:1.55;color:var(--muted)}
      .field{margin-bottom:13px}
      .field label{display:block;font-size:.8rem;font-weight:700;color:var(--ink-2);margin-bottom:6px}
      .field .count{float:right;font-weight:600;color:var(--muted)}
      .field .count.ok{color:var(--good)}
      .field input,.field select,.field textarea{
        width:100%;font:inherit;font-size:.93rem;color:var(--ink);
        background:#fff;border:1.5px solid var(--line);border-radius:12px;
        padding:12px 14px;min-height:48px;outline:none;
        transition:border-color .15s ease,box-shadow .15s ease;
      }
      .field textarea{resize:vertical;min-height:76px;line-height:1.5}
      .field input:focus,.field select:focus,.field textarea:focus{
        border-color:var(--purple);box-shadow:0 0 0 4px var(--lav);
      }
      .field input::placeholder,.field textarea::placeholder{color:#a49ec0}
      .tool .btn{width:100%;margin-top:5px}
      .result{display:none;margin-top:18px;border-radius:var(--r-md);padding:18px}
      .result.show{display:block}
      .result.error{background:var(--bad-bg);color:#7f1d1d;font-size:.9rem;font-weight:600;line-height:1.55}
      .result.ok-panel{background:var(--lav-soft)}
      .score-line{display:flex;align-items:center;gap:16px;margin-bottom:14px}
      .score-ring{position:relative;width:74px;height:74px;flex:none}
      .score-ring svg{transform:rotate(-90deg)}
      .score-ring .n{
        position:absolute;inset:0;display:grid;place-items:center;
        font-weight:800;font-size:1.12rem;letter-spacing:-.02em;
      }
      .score-meta b{display:block;font-size:1rem;margin-bottom:3px}
      .score-meta span{font-size:.82rem;color:var(--muted);line-height:1.45;display:block}
      .meter{height:9px;border-radius:99px;background:var(--lav);overflow:hidden;margin:4px 0 14px}
      .meter i{display:block;height:100%;background:var(--purple);border-radius:99px;transition:width .5s ease}
      .checks{list-style:none;margin:0;padding:0;display:grid;gap:9px}
      .checks li{display:flex;gap:10px;align-items:flex-start;font-size:.88rem;line-height:1.5;color:var(--ink-2)}
      .checks .st{
        width:21px;height:21px;border-radius:50%;flex:none;display:grid;place-items:center;margin-top:1px;color:#fff;
      }
      .checks li.pass .st{background:var(--good)}
      .checks li.warn .st{background:var(--warn)}
      .checks li.fail .st{background:var(--bad)}
      .advice{
        margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:12px;
        padding:12px 14px;font-size:.86rem;line-height:1.55;color:var(--ink-2);
      }
      .advice b{color:var(--purple-deep)}
      .big-val{font-size:1.55rem;font-weight:800;letter-spacing:-.02em;color:var(--purple-deep);margin:2px 0 12px}
      .big-val small{font-size:.85rem;font-weight:600;color:var(--muted);letter-spacing:0}
      .stat-row{display:flex;gap:10px;margin:0 0 14px}
      .stat{
        flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;
        padding:10px 8px;text-align:center;min-width:0;
      }
      .stat b{display:block;font-size:1.02rem;letter-spacing:-.01em;overflow-wrap:anywhere}
      .stat span{font-size:.68rem;font-weight:700;color:var(--muted);letter-spacing:.04em}

      /* ---------- Extra tool UI (tools 7-12) ---------- */
      .qr-wrap{display:grid;place-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
      .qr-wrap canvas,.qr-wrap img{max-width:220px;width:100%;height:auto;image-rendering:pixelated}
      .file-drop{border:1.8px dashed #c9bdf5;border-radius:14px;background:var(--lav-soft);padding:18px 14px;text-align:center;cursor:pointer}
      .file-drop:hover{border-color:var(--purple)}
      .file-drop b{display:block;font-size:.92rem;margin-bottom:4px;color:var(--purple-deep)}
      .file-drop span{font-size:.82rem;color:var(--muted)}
      .file-drop input{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
      .prev-img{width:100%;border-radius:12px;border:1px solid var(--line);margin-bottom:12px;max-height:240px;object-fit:contain;background:#fff}
      input[type="range"]{width:100%;accent-color:var(--purple);min-height:32px;padding:0 !important;border:0 !important;box-shadow:none !important}
      .range-row{display:flex;align-items:center;gap:12px}
      .range-row input[type="range"]{flex:1}
      .range-val{font-weight:800;color:var(--purple-deep);background:var(--lav);border-radius:999px;padding:5px 12px;font-size:.85rem;white-space:nowrap}
      .toggle-row{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
      .toggle-chip{border:1.5px solid var(--line);background:#fff;color:var(--ink-2);border-radius:999px;padding:9px 14px;font:inherit;font-size:.83rem;font-weight:700;cursor:pointer;min-height:40px}
      .toggle-chip[aria-pressed="true"]{background:var(--purple);border-color:var(--purple);color:#fff}
      .pwd-out{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:1rem !important;letter-spacing:.02em;word-break:break-all}
      .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
      .btn-row .btn{margin-top:0}
      .btn.secondary{background:#fff;color:var(--purple-deep);border:1.5px solid var(--purple);box-shadow:none}
      .btn.secondary:hover{background:var(--lav-soft)}
      .thumb-grid{display:grid;gap:10px;margin-top:12px}
      .thumb-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
      .thumb-item b{font-size:.88rem}
      .thumb-item span{display:block;font-size:.76rem;color:var(--muted);font-weight:600}
      .thumb-item a{font-size:.82rem;font-weight:800;color:var(--purple);white-space:nowrap;padding:8px 4px}
      .rate-note{font-size:.82rem;color:var(--muted);line-height:1.55;margin-top:10px}
      .rate-note b{color:var(--purple-deep)}

      /* ---------- Promo banner ---------- */
      .banner{
        margin-top:64px;background:var(--lav-banner);border-radius:28px;
       padding:44px 48px;display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;
overflow:hidden;position:relative;
}
.banner h2{font-size:clamp(1.8rem,3.4vw,2.5rem);letter-spacing:-.025em;margin:14px 0 8px;font-weight:800}
.banner p{margin:0 0 24px;color:var(--ink-2);font-size:1rem}
.banner-cards{position:relative;height:190px}
.bcard{
position:absolute;width:158px;background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);
padding:16px;border:4px solid #fff;
}
.bcard .bc-flag{
display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.05em;
background:var(--lav);color:var(--purple-deep);border-radius:6px;padding:3px 8px;margin-bottom:9px;
}
.bcard b{display:block;font-size:1.5rem;letter-spacing:-.02em}
.bcard span{font-size:.76rem;font-weight:600;color:var(--muted)}
.bcard .mini-bar{margin-top:10px}
.bc-1{left:0;top:22px;transform:rotate(-7deg);z-index:1}
.bc-2{left:50%;margin-left:-79px;top:0;transform:rotate(2deg);z-index:2}
.bc-3{right:0;top:26px;transform:rotate(8deg);z-index:3}
.banner .spark{top:26px;left:46%}

/* ---------- Why choose us ---------- */
.why-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;text-align:center}
.why-item{padding:10px 12px}
.why-item .wi{
width:64px;height:64px;border-radius:50%;background:var(--lav-soft);color:var(--purple);
display:grid;place-items:center;margin:0 auto 16px;
}
.why-item b{display:block;font-size:1rem;margin-bottom:5px}
.why-item span{font-size:.86rem;color:var(--muted)}

/* ---------- Subscribe ---------- */
.subscribe{
margin:58px 0 0;background:var(--lav-soft);border-radius:var(--r-lg);
padding:30px 34px;display:flex;align-items:center;gap:26px;flex-wrap:wrap;
}
.sub-left{display:flex;gap:16px;align-items:center;flex:1;min-width:260px}
.sub-left .si{
width:56px;height:56px;border-radius:16px;background:#fff;color
