<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SiteSale GeoFix - PRO US SEO & Traffic Tools</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f6ff;margin:0;padding:15px}
h1{text-align:center;color:#1a3cff}
.sub{text-align:center;color:#555;margin-top:-10px}
.box{background:#fff;border-radius:12px;padding:18px;margin:15px 0;box-shadow:0 2px 10px #0001}
h2{margin-top:0}
input,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;font-size:15px}
button{width:100%;padding:13px;background:#1a3cff;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}
button:active{background:#0d26b0}
.result{margin-top:15px;background:#f8faff;border-left:4px solid #1a3cff;padding:12px;border-radius:8px;white-space:pre-line;line-height:1.6;font-size:14px}
.score{font-size:28px;font-weight:bold;color:#1a3cff}
.green{color:green;font-weight:bold}.red{color:red;font-weight:bold}.orange{color:#e67e00;font-weight:bold}
.tip{background:#fff8e1;padding:10px;border-radius:8px;margin-top:10px}
.footer{text-align:center;color:#777;font-size:13px;margin:20px}
</style>
</head>
<body>

<h1>🌍 SiteSale GeoFix - PRO</h1>
<p class="sub">Sab tools ab PRO aur Detailed Report ke saath active hain</p>

<!-- TOOL 1 -->
<div class="box">
<h2>1. 🇺🇸 US SEO Checker - PRO Report</h2>
<input id="url" placeholder="Website URL - jese sitesale-geofix.pages.dev">
<input id="title" placeholder="Page Title likhein">
<textarea id="desc" placeholder="Meta Description likhein"></textarea>
<input id="key" placeholder="Main Keyword for US - jese buy website">
<button onclick="checkSEO()">CHECK SEO - PRO REPORT</button>
<div id="seoOut" class="result" style="display:none"></div>
</div>

<!-- TOOL 2 -->
<div class="box">
<h2>2. 🌍 Geo Traffic Analyzer - PRO</h2>
<input type="number" id="total" placeholder="Total Visitors - jese 1000">
<input type="number" id="us" placeholder="US Visitors - jese 600">
<input type="number" id="uk" placeholder="UK Visitors - jese 100 (optional)">
<button onclick="checkGeo()">ANALYZE TRAFFIC - PRO REPORT</button>
<div id="geoOut" class="result" style="display:none"></div>
</div>

<!-- TOOL 3 -->
<div class="box">
<h2>3. ✅ Traffic Quality Check - PRO</h2>
<input type="number" id="bounce" placeholder="Bounce Rate % - jese 40">
<input type="number" id="time" placeholder="Avg. Time on Site (seconds) - jese 120">
<input type="number" id="pages" placeholder="Pages Per Visit - jese 3">
<button onclick="checkQuality()">CHECK QUALITY - PRO REPORT</button>
<div id="qualityOut" class="result" style="display:none"></div>
</div>

<p class="footer">SiteSale GeoFix PRO © 2026 | US Verified Traffic Tools</p>

<script>
function checkSEO(){
let url=document.getElementById('url').value.trim();
let title=document.getElementById('title').value.trim();
let desc=document.getElementById('desc').value.trim();
let key=document.getElementById('key').value.trim().toLowerCase();
if(!title||!desc||!key){alert('Please Title, Description aur Keyword likhein');return;}
let score=0; let report='';
let tLen=title.length; let dLen=desc.length;
report+='📊 PRO SEO REPORT\n';
report+='URL: '+(url||'Not Given')+'\n\n';
// Title
if(tLen>=30 && tLen<=60){score+=30; report+='✅ TITLE: Perfect ('+tLen+' letters)\n';}
else if(tLen<30){score+=10; report+='❌ TITLE: Chota hai ('+tLen+' letters) - 30-60 hona chahiye\n💡 SUGGESTION: "'+key.charAt(0).toUpperCase()+key.slice(1)+' in US | Premium & Verified Websites For Sale"\n';}
else{score+=15; report+='⚠️ TITLE: Lamba hai ('+tLen+' letters) - Chota karein\n';}
// Desc
if(dLen>=120 && dLen<=160){score+=30; report+='✅ DESCRIPTION: Perfect ('+dLen+' letters)\n';}
else if(dLen<120){score+=10; report+='❌ DESCRIPTION: Choti hai ('+dLen+' letters) - 120-160 honi chahiye\n💡 SUGGESTION: Is me Keyword aur "USA, Verified, Real Visitors" zaroor likhein\n';}
else{score+=15; report+='⚠️ DESCRIPTION: Lambi hai ('+dLen+' letters)\n';}
// Keyword
if(title.toLowerCase().includes(key)){score+=25; report+='✅ KEYWORD: Title me hai - Google ko samajh aa jayega\n';}
else{score+=0; report+='❌ KEYWORD: "'+key+'" Title me NAHI hai - Is waja se rank nahi aayega\n💡 FIX: Title ke shuru me "'+key+'" likhein\n';}
if(desc.toLowerCase().includes(key)){score+=15; report+='✅ KEYWORD: Description me bhi hai\n';}
else{report+='❌ KEYWORD: Description me bhi nahi hai\n';}
report+='\n⭐ FINAL SEO SCORE: '+score+'/100\n';
if(score>=80) report+='🎉 EXCELLENT! Ye page US me rank kar sakta hai. Isko aise hi rakhein.\n';
else if(score>=50) report+='🟡 AVERAGE: Thori fixing chahiye. Upar wali suggestions follow karein, score 90+ ho jayega.\n';
else report+='🔴 WEAK: Is page ko Google me rank nahi milega. Upar wali SUGGESTION copy karke Title/Description badlein.\n';
report+='\n🇺🇸 US RANKING TIPS:\n1. Title me US / USA zaroor likhein\n2. Description me "Real US Visitors" likhein\n3. Page par US ka flag aur GeoFix Verified badge lagayein\n4. Har hafte 1 naya article likhein';
let out=document.getElementById('seoOut'); out.style.display='block'; out.innerText=report;
}
function checkGeo(){
let total=+document.getElementById('total').value;
let us=+document.getElementById('us').value;
let uk=+document.getElementById('uk').value||0;
if(!total||us<0){alert('Total aur US Visitors likhein');return;}
let usP=Math.round((us/total)*100); let ukP=Math.round((uk/total)*100); let other=100-usP-ukP;
let report='🌍 PRO GEO TRAFFIC REPORT\n\n';
report+='Total Visitors: '+total+'\nUS Visitors: '+us+' ('+usP+'%)\nUK Visitors: '+uk+' ('+ukP+'%)\nOther Countries: '+other+'%\n\n';
if(usP>=50){report+='✅ VERDICT: PREMIUM US TRAFFIC!\nIs website ki value ZYADA hai. US advertisers is ke liye zyada paisa dete hain.\n💰 ESTIMATED VALUE: HIGH - $500 to $2000+ me bik sakti hai\n';}
else if(usP>=30){report+='🟡 VERDICT: AVERAGE US TRAFFIC\nTheek hai lekin US traffic barhana hoga.\n💡 TIP: US Facebook Groups aur Pinterest se US traffic layein. US traffic 50% se upar le jayein to price double ho jayegi.\n';}
else{report+='🔴 VERDICT: LOW US TRAFFIC\nUS buyers is ko pasand nahi karein ge.\n💡 FIX: Sirf US audience ko target karein. India/Pakistan traffic kam karein.\n';}
report+='\n📈 BUYER KO KYA BATAYEIN:\n"Is site par '+usP+'% real US visitors hain, GeoFix Verified hai." - Ye line likhne se buyer ka trust barhega.';
let out=document.getElementById('geoOut'); out.style.display='block'; out.innerText=report;
}
function checkQuality(){
let bounce=+document.getElementById('bounce').value;
let time=+document.getElementById('time').value;
let pages=+document.getElementById('pages').value;
if(bounce===''||!time||!pages){alert('Teeno boxes bharein');return;}
let score=100; let report='✅ PRO TRAFFIC QUALITY REPORT\n\n';
if(bounce<40){report+='✅ BOUNCE RATE: '+bounce+'% - Bohat Acha! Log site par rukte hain.\n';}
else if(bounce<60){score-=20; report+='🟡 BOUNCE RATE: '+bounce+'% - Theek hai, thora behtar ho sakta hai.\n';}
else{score-=40; report+='❌ BOUNCE RATE: '+bounce+'% - Bohat Zyada! Log foran wapas ja rahe hain. Matlab traffic nakli ya galat hai.\n';}
if(time>=120){report+='✅ TIME: '+time+' sec - Log der tak rukte hain, matlab content pasand aa raha hai.\n';}
else if(time>=60){score-=10; report+='🟡 TIME: '+time+' sec - Thora kam hai. Content lamba aur dilchasp karein.\n';}
else{score-=30; report+='❌ TIME: '+time+' sec - Log 1 minute se pehle bhag jate hain.\n';}
if(pages>=3){report+='✅ PAGES: '+pages+' pages - Log ek se zyada page dekhte hain, ye real traffic ki nishani hai.\n';}
else{score-=15; report+='⚠️ PAGES: '+pages+' - Log sirf 1 page dekh kar chale jate hain.\n';}
report+='\n⭐ QUALITY SCORE: '+score+'/100\n';
if(score>=80) report+='🎉 VERDICT: 100% REAL & HIGH QUALITY TRAFFIC - Buyer ko ye report dikhayein, wo foran khareede ga.';
else if(score>=50) report+='🟡 VERDICT: MIXED TRAFFIC - Thora bot aur thora real lag raha hai. Content behtar karein.';
else report+='🔴 VERDICT: LOW QUALITY / BOT TRAFFIC - Is traffic se site nahi bikegi. Pehle real traffic layein.';
let out=document.getElementById('qualityOut'); out.style.display='block'; out.innerText=report;
}
</script>
</body>
  </html>
